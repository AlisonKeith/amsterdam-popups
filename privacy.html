<p class="updated">Last updated: 27 June 2026</p>

<h2>1. Who we are</h2>
<p>This Privacy Policy governs the privacy practices of Amsterdam Pop-ups (accessible via amsterdampopups.com). Amsterdam Pop-ups is an independent, non-commercial guide run by private individuals based in Amsterdam, the Netherlands. For any privacy-related inquiries, please contact us at hello@amsterdampopups.com.</p>

<p><strong>Log data.</strong> Like most website operators, we and our hosting and infrastructure partners (GitHub Pages and Cloudflare) automatically collect non-personally-identifying information of the sort that web browsers and servers typically make available. This includes browser type, language preference, referring site, and the date and time of each visitor request. We use this only to operate and secure the site.</p>

<p>For visitors in the EEA, the UK and Switzerland, advertising and measurement run under Google Consent Mode and are activated only after you give consent; if you reject, no advertising cookies are set. You can change your choice at any time using the "Cookie settings" link in the site footer.</p>

<p>Under the GDPR you have the right to access, correct or delete the personal data we hold about you, to object to or restrict its processing, and to withdraw consent at any time. To exercise any of these rights, contact us at the address above. You also have the right to lodge a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens).</p>

const BACK = { en:"Back to Amsterdam Pop-ups", nl:"Terug naar Amsterdam Pop-ups" };
const FOOT = { en:"Amsterdam Pop-ups · independent local guide", nl:"Amsterdam Pop-ups · onafhankelijke lokale gids" };
const CHROME = {

};
let lang = "en";
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  const enBtn = document.getElementById("lang-en"), nlBtn = document.getElementById("lang-nl");
  enBtn.classList.toggle("on", l==="en");
  nlBtn.classList.toggle("on", l==="nl");
  if(l==="en"){ enBtn.setAttribute("aria-current","page"); nlBtn.removeAttribute("aria-current"); }
  else { nlBtn.setAttribute("aria-current","page"); enBtn.removeAttribute("aria-current"); }
  const C = CHROME[l];
  document.getElementById("skip").textContent = C.skip;
  document.getElementById("tagline").textContent = C.tagline;
  document.getElementById("brand").setAttribute("href", C.home);
  document.getElementById("sitenav").setAttribute("aria-label", C.nav);
  document.getElementById("langnav").setAttribute("aria-label", C.lang);
  for(const id of ["thisweek","archive","tip","about"]){
    const a = document.getElementById("tab-"+id);
    a.setAttribute("href", C[id][0]);
    a.textContent = C[id][1];
  }
  document.getElementById("tab-holidays").textContent = C.holidays;
  document.getElementById("tab-holidays").setAttribute("aria-expanded", document.getElementById("nav-holidays").open ? "true" : "false");
  for(const [id, href, label] of C.hols){
    const a = document.getElementById(id);
    a.setAttribute("href", href);
    a.textContent = label;
  }
  document.getElementById("policy").innerHTML = POLICY[l];
  document.getElementById("back").textContent = BACK[l];
  document.querySelector(".back").setAttribute("href", C.home);
  document.getElementById("foot").textContent = FOOT[l];
  if(window.applyConsentI18n) applyConsentI18n(l);
}
setLang("en");
function initNavDrop(){
  const drops = document.querySelectorAll("details.nav-drop");
  if(!drops.length) return;
  function sync(d){
    const s = d.querySelector("summary");
    if(s) s.setAttribute("aria-expanded", d.open ? "true" : "false");
    const list = d.querySelector(".nav-drop-list");
    if(!list) return;
    if(!d.open){
      list.style.position = "";
      list.style.top = "";
      list.style.left = "";
      list.style.right = "";
      return;
    }
    const sr = s.getBoundingClientRect();
    list.style.position = "fixed";
    list.style.top = Math.round(sr.bottom) + "px";
    list.style.left = Math.round(sr.left) + "px";
    list.style.right = "auto";
    const r = list.getBoundingClientRect();
    if(r.right > window.innerWidth - 8){
      list.style.left = Math.max(8, Math.round(window.innerWidth - 8 - r.width)) + "px";
    }
  }
  drops.forEach(d => {
    sync(d);
    d.addEventListener("toggle", () => sync(d));
  });
  window.addEventListener("scroll", () => drops.forEach(sync), {passive:true});
  window.addEventListener("resize", () => drops.forEach(sync));
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    drops.forEach(d => {
      if(!d.open) return;
      d.open = false;
      const s = d.querySelector("summary");
      if(s) s.focus();
    });
  });
  document.addEventListener("click", e => {
    drops.forEach(d => { if(d.open && !d.contains(e.target)) d.open = false; });
  });
}
initNavDrop();

<script>
const CONSENT_I18N = {"en":{"cookieText":"This site stays cookie-free until you allow ads. Accept to enable advertising and basic measurement; reject to keep only what's strictly necessary — you can change this anytime on the Privacy page.","cookieAccept":"Accept","cookieReject":"Reject","cookieFab":"Cookie choices","privacy":"Privacy","consentAria":"Cookie consent"},"nl":{"cookieText":"Deze site gebruikt geen cookies totdat je advertenties toestaat. Accepteer om advertenties en basismeting in te schakelen; weiger om alleen het strikt noodzakelijke te houden — je kunt dit altijd aanpassen op de Privacy-pagina.","cookieAccept":"Accepteren","cookieReject":"Weigeren","cookieFab":"Cookievoorkeuren","privacy":"Privacy","consentAria":"Cookietoestemming"}};
function applyConsentI18n(L){
  const T = CONSENT_I18N[L] || CONSENT_I18N.en;
  document.querySelectorAll("#consent [data-i18n], #cookiefab [data-i18n]").forEach(function(el){
    const v = T[el.getAttribute("data-i18n")];
    if(v) el.textContent = v;
  });
  const b = document.getElementById("consent");
  if(b) b.setAttribute("aria-label", T.consentAria);
  const f = document.getElementById("cookiefab");
  if(f) f.setAttribute("aria-label", T.cookieFab);
}
applyConsentI18n(document.documentElement.lang || "en");
/* ---- cookie settings (reopen the banner to change consent) ---- */
function setFab(show){ const f=document.getElementById("cookiefab"); if(f) f.style.display = show ? "inline-flex" : "none"; }
// When the banner opens, keyboard focus moves onto its first control (Reject). When it closes, focus goes back to
// the cookie button if the banner was reopened from it, or to the skip link after a first-visit choice.
let consentReturn = null;
function showConsent(returnTo){ const b=document.getElementById("consent"); if(!b) return; b.style.display="flex"; consentReturn=returnTo; const first=b.querySelector("button"); if(first) first.focus({preventScroll:true}); }
function returnConsentFocus(){ const to=consentReturn; consentReturn=null; const el = to==="fab" ? document.getElementById("cookiefab") : document.querySelector(".skip-link"); if(el) el.focus({preventScroll:true}); }
function openConsent(){ setFab(false); showConsent("fab"); }
document.addEventListener("keydown", function(e){
  const b=document.getElementById("consent"); if(!b || b.style.display!=="flex") return;
  if(e.key==="Escape"){ consentChoice(false); return; }
  // aria-modal dialog: Tab and Shift+Tab cycle through the banner's own controls while it is open
  if(e.key==="Tab"){ const f=b.querySelectorAll("button, a[href]"); if(!f.length) return; const first=f[0], last=f[f.length-1];
    if(e.shiftKey && (document.activeElement===first || !b.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (document.activeElement===last || !b.contains(document.activeElement))){ e.preventDefault(); first.focus(); } }
});

/* ---- consent (Consent Mode v2) ---- */
function getCookie(n){ try{ return (document.cookie.split("; ").find(r=>r.indexOf(n+"=")===0)||"").split("=")[1]||null; }catch(e){ return null; } }
function setCookie(n,v){ try{ document.cookie=n+"="+v+";path=/;max-age=15552000;samesite=lax"; }catch(e){} }
function applyConsent(granted){
  try{ gtag("consent","update",{ad_storage:granted?"granted":"denied",ad_user_data:granted?"granted":"denied",ad_personalization:granted?"granted":"denied",analytics_storage:granted?"granted":"denied"}); }catch(e){}
  // basic consent mode: gtag.js is fetched only now, after Accept (no-op with ?notrack, or if already loaded)
  if(granted && window.apLoadGA) window.apLoadGA();
  /* if(granted){ load adsbygoogle.js once here, then push each ad slot } */
}
function consentChoice(granted){ applyConsent(granted); setCookie("apu_consent", granted?"granted":"denied"); const b=document.getElementById("consent"); const wasOpen = b && b.style.display==="flex"; if(b) b.style.display="none"; setFab(true); if(wasOpen) returnConsentFocus(); }
function initConsent(){
  const c=getCookie("apu_consent"), b=document.getElementById("consent");
  if(c==="granted"){ applyConsent(true); if(b) b.style.display="none"; setFab(true); }
  else if(c==="denied"){ if(b) b.style.display="none"; setFab(true); }
  else { setFab(false); showConsent("skip"); }
}
initConsent();
</script>
